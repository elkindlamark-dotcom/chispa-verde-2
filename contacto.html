<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto · Chispa Verde</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700&amp;display=swap">
    <link rel="stylesheet" href="css/estilos.css">
    <script src="js/contacto.js" defer></script>
</head>
<body class="container py-3">
    <header class="encabezado">
        <div class="marca">
            <img class="logo" src="img/logo.svg" alt="Logo de Chispa Verde, un rayo dentro de un círculo naranja" width="56" height="56">
            <h1>Contacto</h1>
        </div>
        <p>Escríbenos si tienes dudas sobre algún producto.</p>
        <nav class="menu">
            <a href="index.html">Inicio</a>
            <a href="catalogo.html">Catálogo</a>
            <a href="nosotros.html">Nosotros</a>
            <a href="contacto.html" aria-current="page">Contacto</a>
        </nav>
    </header>

    <main>
        <section class="formulario">
            <h2>Formulario de contacto</h2>
            <form id="formulario" action="#" method="post">
                <div class="mb-3">
                    <label for="nombre" class="form-label">Nombre completo</label>
                    <input type="text" id="nombre" name="nombre" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label for="correo" class="form-label">Correo electrónico</label>
                    <input type="email" id="correo" name="correo" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label for="telefono" class="form-label">Teléfono</label>
                    <input type="tel" id="telefono" name="telefono" class="form-control">
                </div>
                <div class="mb-3">
                    <label for="ciudad" class="form-label">Ciudad</label>
                    <select id="ciudad" name="ciudad" class="form-select" required>
                        <option value="">Elige una ciudad</option>
                        <option value="medellin">Medellín</option>
                        <option value="bogota">Bogotá</option>
                        <option value="cali">Cali</option>
                        <option value="barranquilla">Barranquilla</option>
                        <option value="otra">Otra</option>
                    </select>
                </div>
                <div class="mb-3">
                    <label for="asunto" class="form-label">Asunto</label>
                    <input type="text" id="asunto" name="asunto" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label for="mensaje" class="form-label">Mensaje</label>
                    <textarea id="mensaje" name="mensaje" class="form-control" rows="4" required></textarea>
                </div>
                <button type="submit" class="btn btn-primary">Enviar mensaje</button>
            </form>
            <!-- JavaScript escribe aquí la respuesta cuando se envía el formulario -->
            <p id="respuesta" class="respuesta" role="status"></p>
        </section>
    </main>

    <footer class="pie">
        <p>Ingeniería Web I · Institución Universitaria Digital de Antioquia · 2026-2</p>
    </footer>
</body>
</html>
